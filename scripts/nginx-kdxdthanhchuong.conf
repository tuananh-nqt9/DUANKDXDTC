# ==============================================================================
# CẤU HÌNH NGINX CHUẨN CHO NEXT.JS (KDXD THANH CHƯƠNG)
# Website: https://kdxdthanhchuong.vn
# Giải quyết triệt để:
# 1. Upload file lớn (tới 64MB) không bị lỗi 413 Request Entity Too Large
# 2. Nhấn F5 / Reload giữ nguyên trang con, không bị quay về trang chủ
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP sang HTTPS (Bảo toàn đường dẫn $request_uri khi F5)
server {
    listen 80;
    listen [::]:80;
    server_name kdxdthanhchuong.vn www.kdxdthanhchuong.vn;

    # QUAN TRỌNG: Sử dụng $host$request_uri để khi reload HTTP không bị mất trang con về trang chủ
    return 301 https://$host$request_uri;
}

# 2. Máy chủ HTTPS chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kdxdthanhchuong.vn www.kdxdthanhchuong.vn;

    # Chứng chỉ SSL (Let's Encrypt hoặc Certbot)
    ssl_certificate /etc/letsencrypt/live/kdxdthanhchuong.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kdxdthanhchuong.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # CẤU HÌNH GIỚI HẠN UPLOAD FILE (Hỗ trợ upload PDF & hình ảnh tới 64MB)
    client_max_body_size 64M;

    # Timeout cho upload và xử lý file lớn
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Thư mục gốc dự án (nếu cần alias trực tiếp cho public assets)
    root /var/www/DUANKDXDTC;

    # Tối ưu gzip nén dữ liệu
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache cho tài nguyên tĩnh của Next.js
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Phục vụ thư mục documents và uploads tĩnh
    location /documents/ {
        alias /var/www/DUANKDXDTC/public/documents/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /uploads/ {
        alias /var/www/DUANKDXDTC/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ROUTING CHÍNH: Reverse proxy về ứng dụng Next.js (PM2 port 3000)
    # LƯU Ý QUAN TRỌNG ĐỂ KHÔNG BỊ QUAY VỀ TRANG CHỦ KHI F5:
    # 1. Tuyệt đối KHÔNG dùng 'try_files $uri $uri/ /;' ở đây vì Next.js là ứng dụng SSR, không phải SPA tĩnh.
    # 2. Tuyệt đối KHÔNG có dấu gạch chéo cuối 'proxy_pass http://127.0.0.1:3000/;' (phải là http://127.0.0.1:3000;)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
